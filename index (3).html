<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Imóveis</title>
<!-- Compatível com CEF / WebView: arquivo único, sem CDN, sem fontes externas, sem localStorage. Layout horizontal (paisagem) que escala com a tela. -->
<style>
:root{--glass:rgba(18,18,21,.86);--solid:rgba(14,14,17,.97);--card:rgba(255,255,255,.08);--card-h:rgba(255,255,255,.16);--ink:#fff;--muted:#b4b6be;--btn:rgba(255,255,255,.1);--on:#fff;--on-ink:#17171a;--red:#ff4d5a;--ok:#4ade80;--bad:#ff6b6b;--leilao:#ffb547;--cef:#5aa9ff}
*,*::before,*::after{box-sizing:border-box}
html{font-size:11px;font-size:clamp(11px,min(1.15vw,2.3vh),20px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink);font:500 1rem/1.35 "Bahnschrift","Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html.dev body{background:radial-gradient(ellipse at 50% 30%,#2b2118,#0d0a08)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
:focus-visible{outline:.2rem solid #fff;outline-offset:.1rem}
.cond{font-family:"Bahnschrift Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;font-weight:700}
::-webkit-scrollbar{width:.4rem}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:1rem}

.ui{display:flex;width:100%;max-width:96rem;height:100%;margin:0 auto;padding:1rem}
/* Barra lateral */
.side{display:flex;flex-direction:column;width:5.2rem;flex:none;background:var(--glass);border-radius:1.4rem;padding:.7rem .5rem;margin-right:1rem;overflow:auto}
.side .sp{flex:1}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:4rem;padding:.4rem .2rem;border-radius:1rem;background:transparent;margin-bottom:.5rem;font-size:.75rem;line-height:1.1;text-align:center}
.tab svg{width:1.7rem;height:1.7rem;margin-bottom:.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:var(--card-h)}
.tab[aria-selected="true"]{background:var(--on);color:var(--on-ink)}
/* Área principal */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;background:var(--glass);border-radius:1.4rem;padding:.8rem 1rem;margin-bottom:.8rem}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:1.9rem;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.ttl p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;margin:0 1rem}
.chip{background:var(--card);border-radius:.8rem;padding:.35rem .8rem;margin-left:.5rem;font-size:.85rem;white-space:nowrap}
.chip b{display:block;font-size:.7rem;color:var(--muted);font-weight:500}
.chip.ok{background:rgba(74,222,128,.18);color:var(--ok)}.chip.no{background:rgba(255,107,107,.2);color:var(--bad)}
.chip.ok b,.chip.no b{color:inherit;opacity:.8}
.close{width:3.4rem;height:3.4rem;flex:none;border-radius:1rem;background:var(--red);display:flex;align-items:center;justify-content:center}
.close svg{width:1.7rem;height:1.7rem;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.tools{display:flex;align-items:center;margin:0 .3rem .6rem;color:var(--muted);font-size:.9rem}
.tools .n{flex:1}
.tools button{background:var(--btn);border-radius:.7rem;padding:.4rem .9rem;margin-left:.4rem;min-height:2.2rem}
.tools button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.body{flex:1;min-height:0;position:relative}
/* Lista */
.grid{height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));grid-auto-rows:min-content;grid-gap:.9rem;padding-right:.3rem;-webkit-overflow-scrolling:touch}
.card{background:var(--glass);border:.15rem solid transparent;border-radius:1.4rem;overflow:hidden;text-align:left;display:block;width:100%;padding:0 0 .8rem}
.card:hover{background:rgba(50,50,56,.92)}
.art{display:block;width:100%;height:8rem;border-radius:1.3rem}
.info{padding:.6rem .9rem 0}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.price{font-size:2.1rem;line-height:1.05;text-transform:uppercase}
.specs{display:flex;flex-wrap:wrap;font-size:.8rem;margin-top:.2rem}
.specs span{background:var(--card);border-radius:.5rem;padding:.1rem .5rem;margin:0 .3rem .3rem 0}
.own{display:flex;align-items:center;color:var(--muted);font-size:.85rem;margin-top:.2rem}
.own svg{width:.9rem;height:.9rem;fill:currentColor;margin-right:.4rem;flex:none}
.tag{margin-left:auto;font-size:.75rem;font-weight:600;padding:.1rem .6rem;border-radius:1rem;background:var(--card);color:var(--ink);white-space:nowrap}
.leilao .tag{background:var(--leilao);color:#2a1a00}.cef .tag{background:var(--cef);color:#001a33}
/* Painel de detalhe / ajuda */
.sheet{display:none;position:absolute;left:0;right:0;top:0;bottom:0;background:var(--solid);border-radius:1.4rem;padding:1rem;overflow-y:auto;z-index:2;-webkit-overflow-scrolling:touch}
.sheet.on{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-gap:1.2rem;align-content:start}
.sheet .art{height:11rem;border-radius:1.1rem}
.sbtn{background:var(--btn);border-radius:.8rem;padding:.55rem 1rem;margin-bottom:.7rem;min-height:2.6rem}
.no{color:var(--muted);font-size:.9rem}
.dtitle{font-size:1.5rem;text-transform:uppercase;line-height:1}
.dprice{font-size:3rem;line-height:1.05;margin:.2rem 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:.5rem;margin:.8rem 0 0}
.facts div{background:var(--card);border-radius:.8rem;padding:.5rem .7rem;font-size:.95rem}
.facts b{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.about{margin:.8rem 0 0;padding:.7rem .9rem;background:var(--card);border-radius:.8rem;color:var(--muted);font-size:.9rem}
.sec{font-size:.78rem;color:var(--muted);margin:.9rem 0 .4rem;text-transform:uppercase;letter-spacing:.07em}
.sec:first-child{margin-top:0}
.seg{display:grid;grid-template-columns:1fr 1fr;grid-gap:.5rem}
.seg button{border:.15rem solid transparent;background:var(--btn);border-radius:.8rem;padding:.6rem .8rem;text-align:left;min-height:3.4rem}
.seg button[aria-pressed="true"]{border-color:#fff;background:var(--card-h)}
.seg small{display:block;color:var(--muted);font-size:.8rem}
.lance{width:100%;padding:.6rem .8rem;border-radius:.8rem;border:.15rem solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:1.6rem;-webkit-user-select:text;user-select:text}
.req{list-style:none;margin:0;padding:0}
.req li{display:flex;align-items:flex-start;padding:.55rem .8rem;border-radius:.8rem;background:var(--card);margin-bottom:.4rem}
.req li i{font-style:normal;font-weight:700;width:1.6rem;flex:none}
.req li.ok i{color:var(--ok)}.req li.no i{color:var(--bad)}
.req small{display:block;color:var(--muted);font-size:.85rem}
.buy{width:100%;border-radius:1rem;padding:.9rem;margin-top:.6rem;font-size:1.7rem;text-transform:uppercase;background:var(--on);color:var(--on-ink)}
.buy:disabled{opacity:.35}
.warn{color:var(--bad);margin:.4rem .2rem 0;font-size:.9rem}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:flex-start;background:var(--card);border-radius:.8rem;padding:.6rem .8rem;margin-bottom:.4rem}
.steps li::before{content:counter(s);flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--on);color:var(--on-ink);text-align:center;line-height:1.6rem;font-weight:700;margin-right:.7rem}
.legend{display:flex;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.legend span{margin-right:1rem;margin-bottom:.3rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:.6rem 1.1rem;border-radius:.9rem;opacity:0;pointer-events:none;z-index:9;max-width:90%}
#toast.on{opacity:1}
.devbar{display:none;position:fixed;bottom:.4rem;left:.4rem;background:rgba(0,0,0,.7);padding:.3rem .6rem;border-radius:.5rem;font-size:.75rem;z-index:9}
html.dev .devbar{display:block}
.rotate{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:#000;color:#fff;z-index:99;align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:1.3rem}
@media (orientation:portrait) and (max-width:820px){.rotate{display:flex}.ui{display:none}}
@media (max-height:420px){.art{height:6rem}.price{font-size:1.7rem}.sheet .art{height:8rem}.dprice{font-size:2.4rem}}
@media (max-width:720px){.chips{display:none}.sheet.on{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="devbar"><label><input type="checkbox" id="devcef" checked> Simular jogador habilitado na CEF (só no navegador)</label></div>
<div class="rotate">Gire o aparelho para a horizontal para usar o menu de imóveis.</div>

<div class="ui" id="ui">
  <nav class="side" role="tablist" aria-label="Categorias">
    <button class="tab" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Voltar</button>
    <span class="sp"></span>
    <button class="tab" role="tab" data-t="venda"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg>Venda</button>
    <button class="tab" role="tab" data-t="leilao"><svg viewBox="0 0 24 24"><path d="M14 4l6 6M11 7l6 6M8.5 9.5l6 6M4 20h9M10 13l-5 5"/></svg>Leilão</button>
    <button class="tab" role="tab" data-t="cef"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12M2 21h20M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>CEF</button>
    <span class="sp"></span>
    <button class="tab" id="help" aria-label="Como comprar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>Ajuda</button>
  </nav>
  <section class="main">
    <header class="top">
      <div class="ttl"><h1 class="cond" id="titulo"></h1><p id="desc"></p></div>
      <div class="chips">
        <span class="chip"><b>Jogador</b><span id="cNome">-</span></span>
        <span class="chip"><b>Saldo</b><span id="cSaldo">-</span></span>
        <span class="chip" id="cCefBox"><b>Conta CEF</b><span id="cCef">-</span></span>
      </div>
      <button class="close" id="close" aria-label="Fechar menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="tools"><span class="n" id="qtd"></span><span>Ordenar:</span>
      <button data-s="pad" aria-pressed="true">Padrão</button><button data-s="asc" aria-pressed="false">Menor preço</button><button data-s="desc" aria-pressed="false">Maior preço</button>
    </div>
    <div class="body">
      <div class="grid" id="grid"></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="Detalhes"></div>
    </div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
/* ===== 1. Ponte com o jogo (CEF) =====
   ENVIA ao servidor:  houses:buy(id, modo)  houses:bid(id, valor)  houses:close()
   RECEBE do servidor: houses:data(json)  houses:result(ok, mensagem)
   houses:data = { player:{nome,cef,saldo}, tabs:{venda:[...],leilao:[...],cef:[...]} }
   imóvel = { id, preco, dono, area, quartos, vagas, bairro, tag } */
var IN_CEF=!!(window.cef&&window.cef.emit);
if(!IN_CEF)document.documentElement.className+=' dev';
function emit(){var a=[].slice.call(arguments);if(IN_CEF){window.cef.emit.apply(window.cef,a)}else{console.log('[cef.emit]',a)}}
function focus(v){try{if(window.cef&&window.cef.set_focus)window.cef.set_focus(v)}catch(e){}}

/* ===== 2. Dados (exemplo) ===== */
var player={nome:'Jogador_Exemplo',cef:true,saldo:500000};
var BAIRROS=['Jardim América','Centro','Vila Nova','Bairro Alto','Parque Sul','Jardins','Vila Real','Novo Horizonte'];
function mk(n,p,dono,i,tag){return{id:n,preco:p,dono:dono,i:i,tag:tag||'',area:60+(n*7)%140,quartos:2+(n%3),vagas:1+(n%3),bairro:BAIRROS[(n+i)%8]}}
var META={
 venda:{nome:'Venda de casas',desc:'Compre direto do proprietário. Pague à vista ou financie pela CEF.',
  sobre:'Negociação direta: o valor é fixo e a casa passa para você assim que o pagamento é confirmado.',
  l:[[43,445800,'Max_Gam'],[595,240000,'Governo'],[780,895795,'Victoria_H'],[770,2200000,'Danil_Alfa'],[594,950000,'Gaba_Vas'],[101,432000,'Nikita_Koval'],[58,214990,'Governo'],[562,800000,'Bukhoy_Rick']]},
 leilao:{nome:'Leilão de casas',desc:'Dê seu lance. Lance mínimo 5% acima da avaliação; vence o maior lance no prazo.',
  sobre:'Leilão: imóveis com desconto. Se outro jogador cobrir seu lance, o valor volta para o seu saldo.',
  tags:['12/10','19/10','Hoje','2 dias','5 dias','Hoje','3 dias','14/10'],
  l:[[210,210000,'Leilão judicial'],[233,140000,'Leilão judicial'],[118,156000,'Leilão extrajudicial'],[87,325000,'Leilão judicial'],[301,98000,'Leilão extrajudicial'],[64,410000,'Leilão judicial'],[155,187500,'Leilão judicial'],[392,260000,'Leilão extrajudicial']]},
 cef:{nome:'Imóveis CEF',desc:'Imóveis retomados pela CEF. Exige conta CEF habilitada.',
  sobre:'Imóvel da carteira da CEF: aceita financiamento e FGTS conforme a modalidade indicada na etiqueta.',
  tags:['Venda direta','Online','Licitação','FGTS','Venda direta','FGTS','Online','Licitação'],
  l:[[412,185000,'CEF'],[413,230000,'CEF'],[420,210000,'CEF'],[431,158000,'CEF'],[447,275000,'CEF'],[452,199000,'CEF'],[466,142000,'CEF'],[478,320000,'CEF']]}
};
var T={};
Object.keys(META).forEach(function(k){var m=META[k];T[k]={nome:m.nome,desc:m.desc,sobre:m.sobre,lista:m.l.map(function(r,i){return mk(r[0],r[1],r[2],i,m.tags&&m.tags[i])})}});

/* ===== 3. Utilidades ===== */
var P=[['#d9773b','#8a5a34'],['#efe4cf','#6b5a4a'],['#8b6f68','#a33a3a'],['#9a8f88','#a33a3a'],['#58a6a0','#3d6f6c'],['#4a5f80','#38445a'],['#a9743f','#6e4322'],['#5d8fb0','#7a5a3a']];
function brl(n){return 'R$ '+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function $(id){return document.getElementById(id)}
function art(c,k){var i=c.i,w=P[i%8][0],r=P[i%8][1],two=i%3!==1,water=i===7&&k==='venda',y=two?38:52,h=two?52:38,g='s'+i+k;
 return '<svg class="art" viewBox="0 0 240 130" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="'+g+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9de0"/><stop offset="1" stop-color="#c6e4f8"/></linearGradient></defs><rect width="240" height="130" fill="url(#'+g+')"/><rect y="72" width="240" height="58" fill="'+(water?'#3d8ad0':'#5e8f2f')+'"/>'+(water?'':'<polygon points="95,130 145,130 125,86 115,86" fill="#8b8f92"/>')+'<rect x="70" y="'+(y+18)+'" width="100" height="'+h+'" fill="'+w+'"/><polygon points="62,'+(y+18)+' 120,'+(y-8)+' 178,'+(y+18)+'" fill="'+r+'"/><rect x="112" y="'+(y+h-12)+'" width="16" height="30" fill="#4a3324"/><rect x="82" y="'+(y+30)+'" width="16" height="14" fill="#cfe8f6"/><rect x="142" y="'+(y+30)+'" width="16" height="14" fill="#cfe8f6"/>'+(two?'<rect x="82" y="'+(y+52)+'" width="16" height="10" fill="#cfe8f6"/><rect x="142" y="'+(y+52)+'" width="16" height="10" fill="#cfe8f6"/>':'')+'</svg>'}
var USER='<svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 3-5 6-5s6 2 6 5z"/></svg>';
function say(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(say.t);say.t=setTimeout(function(){t.className=''},2800)}
function parcela(v){var p=v*0.8,i=0.0099,n=60;return p*i/(1-Math.pow(1+i,-n))}

/* ===== 4. Estado e cabeçalho do jogador ===== */
var grid=$('grid'),sheet=$('sheet'),tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
var cur='venda',sel=null,mode='avista',sort='pad',view='list';
function drawPlayer(){$('cNome').textContent=player.nome||'-';$('cSaldo').textContent=brl(player.saldo||0);
 $('cCef').textContent=player.cef?'Habilitada ✓':'Não habilitada ✕';$('cCefBox').className='chip '+(player.cef?'ok':'no')}

/* ===== 5. Lista ===== */
function sorted(){var l=T[cur].lista.slice();if(sort==='asc')l.sort(function(a,b){return a.preco-b.preco});if(sort==='desc')l.sort(function(a,b){return b.preco-a.preco});return l}
function show(k){if(k)cur=k;closeSheet();var d=T[cur],l=sorted();
 tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-t')===cur)});
 $('titulo').textContent=d.nome;$('desc').textContent=d.desc;$('qtd').textContent=l.length+' imóveis disponíveis';grid.className='grid '+cur;
 grid.innerHTML=l.map(function(c,n){return '<button class="card" data-n="'+n+'">'+art(c,cur)+'<div class="info"><div class="row"><span>Casa Nº '+c.id+'</span><span>'+c.bairro+'</span></div><div class="price cond">'+brl(c.preco)+'</div><div class="specs"><span>'+c.area+' m²</span><span>'+c.quartos+' quartos</span><span>'+c.vagas+' vagas</span></div><div class="own">'+USER+'<span>'+c.dono+'</span>'+(c.tag?'<span class="tag">'+c.tag+'</span>':'')+'</div></div></button>'}).join('');
 grid._l=l}
grid.addEventListener('click',function(e){var b=e.target;while(b&&b!==grid&&!/\bcard\b/.test(b.className))b=b.parentNode;if(b&&b!==grid)openDetail(grid._l[b.getAttribute('data-n')])});

/* ===== 6. Detalhe de compra ===== */
function openSheet(){sheet.className='sheet on';grid.style.visibility='hidden'}
function closeSheet(){sel=null;view='list';sheet.className='sheet';grid.style.visibility='visible'}
function openDetail(c){sel=c;mode='avista';view='detail';drawDetail();openSheet()}
function drawDetail(lanceVal){
 var c=sel,k=cur,lei=k==='leilao',v=c.preco,lanceMin=Math.ceil(v*1.05),lance=lei?(lanceVal||lanceMin):0;
 var pagar=lei?lance:(mode==='fin'?v*0.2:v);
 var okCef=!!player.cef,okSaldo=player.saldo>=pagar,okLance=!lei||lance>=lanceMin,ok=okCef&&okSaldo&&okLance;
 var li=function(g,t,s){return '<li class="'+(g?'ok':'no')+'"><i>'+(g?'✓':'✕')+'</i><span>'+t+(s?'<small>'+s+'</small>':'')+'</span></li>'};
 sheet.innerHTML=
 '<div><button class="sbtn" id="dback">← Voltar à lista</button>'+art(c,k)+
 '<div class="facts"><div><b>Bairro</b>'+c.bairro+'</div><div><b>Área</b>'+c.area+' m²</div><div><b>Quartos</b>'+c.quartos+'</div><div><b>Garagem</b>'+c.vagas+' vaga(s)</div><div><b>Vendedor</b>'+c.dono+'</div><div><b>Modalidade</b>'+(c.tag||'Venda comum')+'</div></div>'+
 '<p class="about">'+T[k].sobre+'</p></div>'+
 '<div><div class="no">Casa Nº '+c.id+'</div><div class="dtitle cond">'+(lei?'Lance mínimo':'Valor do imóvel')+'</div><div class="dprice cond">'+brl(lei?lanceMin:v)+'</div>'+
 (lei?'<div class="sec">Seu lance</div><input class="lance" id="lance" type="number" inputmode="numeric" min="'+lanceMin+'" step="1000" value="'+lance+'">':
 '<div class="sec">Forma de pagamento</div><div class="seg"><button data-m="avista" aria-pressed="'+(mode==='avista')+'">À vista<small>'+brl(v)+'</small></button><button data-m="fin" aria-pressed="'+(mode==='fin')+'">Financiar pela CEF<small>Entrada '+brl(v*0.2)+' + 60x de '+brl(parcela(v))+'</small></button></div>')+
 '<div class="sec">Requisitos para comprar</div><ul class="req">'+
 li(okCef,'Conta CEF habilitada',okCef?'Cadastro ativo em nome de '+(player.nome||'você'):'Procure a agência CEF da cidade para habilitar sua conta.')+
 li(okSaldo,'Saldo: '+brl(player.saldo),(okSaldo?'Você paga agora: ':'Faltam '+brl(pagar-player.saldo)+'. Total agora: ')+brl(pagar))+
 (lei?li(okLance,'Lance acima do mínimo',okLance?'':'O mínimo é '+brl(lanceMin)):'')+'</ul>'+
 '<button class="buy cond" id="buy"'+(ok?'':' disabled')+'>'+(lei?'Dar lance':'Comprar imóvel')+'</button>'+
 (ok?'':'<div class="warn">'+(!okCef?'Compra bloqueada: conta CEF não habilitada.':(!okSaldo?'Saldo insuficiente.':'Revise o valor do lance.'))+'</div>')+'</div>';
 $('dback').onclick=closeSheet;
 var ms=sheet.querySelectorAll('[data-m]');for(var i=0;i<ms.length;i++)ms[i].onclick=function(){mode=this.getAttribute('data-m');drawDetail()};
 var inp=$('lance');if(inp)inp.onchange=function(){drawDetail(parseInt(this.value,10)||lanceMin)};
 $('buy').onclick=function(){if(!ok)return;
  if(lei){emit('houses:bid',c.id,lance);say('Lance de '+brl(lance)+' enviado.')}else{emit('houses:buy',c.id,mode);say('Pedido de compra da Casa Nº '+c.id+' enviado.')}}
}

/* ===== 7. Ajuda ===== */
function drawHelp(){view='help';sel=null;
 sheet.innerHTML='<div><button class="sbtn" id="dback">← Voltar à lista</button><div class="sec">Como comprar</div><ol class="steps"><li><span>Escolha a categoria: Venda, Leilão ou CEF.</span></li><li><span>Abra o imóvel para ver bairro, área, quartos, garagem e vendedor.</span></li><li><span>Confira os requisitos: conta CEF habilitada e saldo suficiente.</span></li><li><span>Compre à vista, financie (entrada de 20% + 60 parcelas) ou dê seu lance no leilão.</span></li></ol></div>'+
 '<div><div class="sec">Conta CEF</div><p class="about" style="margin-top:0">Sem conta CEF habilitada o botão de compra fica bloqueado. Seu status aparece no topo da tela. Para habilitar, procure a agência CEF da cidade.</p>'+
 '<div class="sec">Legenda das etiquetas</div><div class="legend"><span><b>Data / dias:</b> prazo do leilão</span><span><b>Venda direta:</b> compra imediata</span><span><b>Online:</b> pedido pelo menu</span><span><b>Licitação:</b> vence a melhor oferta</span><span><b>FGTS:</b> aceita FGTS</span></div>'+
 '<div class="sec">Atalhos</div><p class="about" style="margin-top:0">Esc volta uma tela ou fecha o menu. Toque num imóvel para abrir os detalhes.</p></div>';
 $('dback').onclick=closeSheet;openSheet()}

/* ===== 8. Navegação ===== */
tabs.forEach(function(t){t.onclick=function(){show(t.getAttribute('data-t'))}});
$('back').onclick=function(){view==='list'?show('venda'):closeSheet()};
$('help').onclick=drawHelp;
[].forEach.call(document.querySelectorAll('[data-s]'),function(b){b.onclick=function(){sort=b.getAttribute('data-s');[].forEach.call(document.querySelectorAll('[data-s]'),function(x){x.setAttribute('aria-pressed',x===b)});show()}});
$('close').onclick=function(){emit('houses:close');focus(false);if(!IN_CEF)say('No jogo, isto fecha o painel.')};
document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.keyCode===27){view==='list'?$('close').click():closeSheet()}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
$('devcef').onchange=function(){player.cef=this.checked;drawPlayer();if(view==='detail')drawDetail()};

/* ===== 9. Eventos do servidor ===== */
if(IN_CEF){
 window.cef.on('houses:data',function(j){var d=typeof j==='string'?JSON.parse(j):j;
  if(d.player)player=d.player;
  if(d.tabs)Object.keys(d.tabs).forEach(function(k){if(T[k])T[k].lista=d.tabs[k].map(function(c,i){c.i=i;return c})});
  drawPlayer();show()});
 window.cef.on('houses:result',function(ok,msg){say(msg);if(ok)closeSheet()});
 focus(true);
}
drawPlayer();show('venda');
})();
</script>
